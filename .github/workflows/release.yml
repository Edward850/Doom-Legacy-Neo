name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish (e.g. v1.2.3)'
        required: false
        type: string

jobs:
  build-and-release:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            triplet: x64-windows
            archive_name: doom-legacy-neo-windows-x64.zip
            binary_dir: build/Release/*
          #- os: ubuntu-latest
          #  os_name: Linux
          #  triplet: x64-linux
          #  archive_name: doom-legacy-neo-linux-x64.tar.gz
          #  binary_dir: build/*

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Linux Build Tools
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential tar curl zip unzip

    - name: Set up GitHub Actions Cache for vcpkg
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: ${{ matrix.os }}-vcpkg-binaries-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-binaries-

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
      shell: bash

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Package Windows Artifacts
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        Compress-Archive -Path ${{ matrix.binary_dir }} -DestinationPath ${{ matrix.archive_name }}

    - name: Package Linux Artifacts
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        tar -czvf ${{ matrix.archive_name }} -C build .

    - name: Upload Binary to GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
        files: ${{ matrix.archive_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
