name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish (e.g. v1.2.3)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            triplet: x64-windows
            runtime_dir: build/bin/Release
            archive_slug: doom-legacy-neo-windows-x64
            archive_ext: zip
          #- os: ubuntu-latest
          #  os_name: Linux
          #  triplet: x64-linux
          #  binary_dir: build/*
          #  archive_slug: doom-legacy-neo-linux-x64
          #  archive_ext: tar.gz

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'

    steps:
    - name: Determine Archive Name
      shell: bash
      run: |
        SUFFIX=""
        if [[ "${{ github.ref }}" != refs/tags/* ]] && [[ -z "${{ inputs.release_tag }}" ]]; then
          SUFFIX="-preview"
        fi
        echo "ARCHIVE_NAME=${{ matrix.archive_slug }}${SUFFIX}.${{ matrix.archive_ext }}" >> $GITHUB_ENV

    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Linux Build Tools
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential tar curl zip unzip

    - name: Set up GitHub Actions Cache for vcpkg
      uses: actions/cache@v5
      with:
        path: vcpkg_cache
        key: ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
          ${{ matrix.os }}-vcpkg-
          
    - name: Ensure Cache Directory Exists
      run: mkdir -p vcpkg_cache
      shell: bash

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      shell: bash

    - name: Build Project
      run: cmake --build build --config Release

    - name: Package Windows Artifacts
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force staging | Out-Null
        Copy-Item "${{ matrix.runtime_dir }}\doomlegacy.exe" staging\
        Copy-Item "${{ matrix.runtime_dir }}\*.dll" staging\ -ErrorAction SilentlyContinue
        Copy-Item "${{ matrix.runtime_dir }}\legacy.wad" staging\
        Copy-Item "${{ matrix.runtime_dir }}\legacy.dat" staging\
        Get-ChildItem -Path build -Recurse -Include *.pdb, *.map | Copy-Item -Destination staging\
        Compress-Archive -Path staging\* -DestinationPath ${{ env.ARCHIVE_NAME }}

    - name: Package Linux Artifacts
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        tar -czvf ${{ env.ARCHIVE_NAME }} -C build .
        
    - name: Upload Build Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: release-files-${{ matrix.os_name }}
        path: ${{ env.ARCHIVE_NAME }}
        if-no-files-found: error

  publish-preview:
    name: Publish Continuous Preview Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (inputs.release_tag == '' || inputs.release_tag == null)

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Force Update 'preview' Git Tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -f preview ${{ github.sha }}
        git push origin preview --force

    - name: Delete Old Preview Release
      run: gh release delete preview --yes || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Download All Build Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-files-*
        merge-multiple: true
        path: dist

    - name: Upload Binaries to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: preview
        target_commitish: ${{ github.sha }}
        name: 'Continuous Preview Build'
        generate_release_notes: true
        prerelease: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tag:
    name: Publish Tagged Version Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (inputs.release_tag != '' && inputs.release_tag != null)

    steps:
    - name: Download All Build Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-files-*
        merge-multiple: true
        path: dist

    - name: Upload Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}