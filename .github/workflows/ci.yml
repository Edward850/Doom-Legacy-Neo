name: Build Preview Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            triplet: x64-windows
            archive_name: doom-legacy-neo-windows-x64-preview.zip
            runtime_dir: build/bin/Release
          #- os: ubuntu-latest
          #  os_name: Linux
          #  triplet: x64-linux
          #  archive_name: doom-legacy-neo-linux-x64-preview.tar.gz
          #  binary_dir: build/*

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: 'clear;files,vcpkg_cache,readwrite'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Linux Build Tools
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential tar curl zip unzip

    - name: Set up GitHub Actions Cache for vcpkg
      uses: actions/cache@v5
      with:
        path: vcpkg_cache
        key: ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
          ${{ matrix.os }}-vcpkg-
          
    - name: Ensure Cache Directory Exists
      run: mkdir -p vcpkg_cache
      shell: bash

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      shell: bash

    - name: Build Project
      run: cmake --build build --config Release

    - name: Package Windows Artifacts
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force staging | Out-Null
        Copy-Item "${{ matrix.runtime_dir }}\doomlegacy.exe" staging\
        Copy-Item "${{ matrix.runtime_dir }}\*.dll" staging\
        Copy-Item "${{ matrix.runtime_dir }}\legacy.wad" staging\
        Copy-Item "${{ matrix.runtime_dir }}\legacy.dat" staging\
        Compress-Archive -Path staging\* -DestinationPath ${{ matrix.archive_name }}

    - name: Package Linux Artifacts
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        tar -czvf ${{ matrix.archive_name }} -C build .
        
    - name: Upload Build Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: release-files-${{ matrix.os_name }}
        path: ${{ matrix.archive_name }}
        if-no-files-found: error
        
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Force Update 'preview' Git Tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -f preview ${{ github.sha }}
        git push origin preview --force

    - name: Delete Old Preview Release
      run: gh release delete preview --yes || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Download All Build Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-files-*
        merge-multiple: true
        path: dist

    - name: Upload Binaries to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: preview
        target_commitish: ${{ github.sha }}
        name: 'Continuous Preview Build'
        generate_release_notes: true
        prerelease: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}