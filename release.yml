name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when you push a tag starting with 'v' (e.g., v1.0.0)
  workflow_dispatch: # Testing workflow

jobs:
  build-and-release:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            triplet: x64-windows
            archive_name: doom-legacy-neo-windows-x64.zip
            binary_dir: build/Release/*
          #- os: ubuntu-latest
          #  os_name: Linux
          #  triplet: x64-linux
          #  archive_name: doom-legacy-neo-linux-x64.tar.gz
          #  binary_dir: build/*

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup essential C++ compilation dependencies on the Linux runner
    - name: Install Linux Build Tools
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential tar curl zip unzip

    - name: Set up GitHub Actions Cache for vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          ${{ github.workspace }}/build/vcpkg_installed
        key: ${{ matrix.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ matrix.os }}-vcpkg-

    - name: Setup vcpkg
      uses: microsoft/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      shell: bash # Explicitly use bash so the toolchain path slashes work across both systems

    - name: Build Project
      run: |
        cmake --build build --config Release

    # Package files using native runners (PowerShell on Windows, Bash on Linux)
    - name: Package Windows Artifacts
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        Compress-Archive -Path ${{ matrix.binary_dir }} -DestinationPath ${{ matrix.archive_name }}

    - name: Package Linux Artifacts
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        tar -czvf ${{ matrix.archive_name }} -C build .

    # Both runners safely upload to the same release concurrently
    - name: Upload Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.archive_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
